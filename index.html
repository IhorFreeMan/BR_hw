<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lesson_10 Box-model</title>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <header class="header">
            <div class="container flex-container">
                <div class="logo">

                <nav class="nav">
                    <ul class="menu">
                        <li class="menu__item">

                        <li class="menu__item">

                        </li>
                        <li class="menu__item">
                            <a href="#" class="menu__link">Portfolio</a>
                        </li>
                        <li class="menu__item">

                    </ul>
                </nav>
            </div>

            <div class="container">

                    <ul class="citys">

                        <li class="city">

                        <li class="city">

                        <li class="city">

                            <h4>Cair</h4>
                        </li>
                        <li class="city">
                            <h4>New-York</h4>
                        </li>
                        <li class="city">
                            <h4>New-Delhi</h4>
                        </li>
                        <li class="city city_half">
                            <h4>San-Francisco</h4>
                        </li>
                        <li class="city">
                            <h4>Sydney</h4>
                        </li>
                        <li class="city city_full">
                            <h4>Dnipro</h4>
                        </li>
                    </ul>
                </section>
            </div>
        </main>

</html>
