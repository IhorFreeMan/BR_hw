<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/shopping_list/main.css">
</head>

<body class="body">
    <header>

        <h1 class="header-name">CSS Dinner Shopping List</h1>
        <p class="subtitle">Let's go to the mall!</p>
    </header>
    <main class="main">
        <ul class="main-ul">
            <li class="main-ul-li">
                <label>
                    <input type="checkbox">
                    A lot of pickles <span class="note">(for the next lessons about CSS)</span>
                </label>
            </li>

            <li class="main-ul-li">
                <label>
                    <input type="checkbox">
                    10 apples <span class="note">(for more CSS manipulations)</span>
                </label>
            </li>

            <li class="main-ul-li">
                <label>
                    <input type="checkbox">
                    20 oranges <span class="note">(because they are awesome)</span>
                </label>
            </li>

            <li class="main-ul-li">
                <label>
                    <input type="checkbox">
                    13 plates <span class="note">(hm... they always disappear)</span>
                </label>
            </li>

            <li class="main-ul-li">
                <label>
                    <input type="checkbox">
                    15 bentos
                </label>
            </li>

            <li class="main-ul-li">
                <label>
                    <input type="checkbox">
                    1 bottle of Sake <span class="note">(for my friends)</span>
                </label>
            </li>
        </ul>


        <button class="btn">Bon appetit :)</button>
    </main>
    <footer></footer>

</body>

</html>
